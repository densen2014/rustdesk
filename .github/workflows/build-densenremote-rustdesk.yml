name: Build DensenRemote RustDesk Runtime

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  BRIDGE_FLUTTER_VERSION: "3.22.3"
  CARGO_EXPAND_VERSION: "1.0.95"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"

jobs:
  generate-bridge:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout RustDesk 1.4.9
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: 1.4.9
          submodules: recursive

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake curl gcc git g++ libclang-dev libgtk-3-dev llvm-dev nasm ninja-build pkg-config wget

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-unknown-linux-gnu
          components: rustfmt

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.BRIDGE_FLUTTER_VERSION }}
          cache: true

      - name: Generate bridge
        shell: bash
        run: |
          cargo install cargo-expand --version "${CARGO_EXPAND_VERSION}" --locked
          cargo install flutter_rust_bridge_codegen --version "${FLUTTER_RUST_BRIDGE_VERSION}" --features uuid --locked
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          pushd flutter
          flutter pub get
          popd
          flutter_rust_bridge_codegen \
            --rust-input ./src/flutter_ffi.rs \
            --dart-output ./flutter/lib/generated_bridge.dart \
            --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h

      - name: Upload bridge
        uses: actions/upload-artifact@v4
        with:
          name: bridge-artifact
          path: |
            src/bridge_generated.rs
            src/bridge_generated.io.rs
            flutter/lib/generated_bridge.dart
            flutter/lib/generated_bridge.freezed.dart
            flutter/macos/Runner/bridge_generated.h
            flutter/ios/Runner/bridge_generated.h

  build-windows-x64:
    needs: generate-bridge
    runs-on: windows-2022
    steps:
      - name: Checkout build configuration
        uses: actions/checkout@v4
        with:
          path: build-config

      - name: Checkout RustDesk 1.4.9
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: 1.4.9
          submodules: recursive
          path: rustdesk

      - name: Restore bridge
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: rustdesk

      - name: Apply DensenRemote patch
        shell: bash
        run: |
          cd rustdesk
          git apply --check ../build-config/patches/rustdesk-1.4.9-temporary-password.patch
          git apply ../build-config/patches/rustdesk-1.4.9-temporary-password.patch

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Replace Flutter engine
        shell: pwsh
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri "https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip" -OutFile engine.zip
          Expand-Archive -Path engine.zip -DestinationPath custom-engine
          $flutterRoot = Split-Path -Parent (Split-Path -Parent (Get-Command flutter).Source)
          $enginePath = Join-Path $flutterRoot "bin\cache\artifacts\engine\windows-x64-release"
          Copy-Item -Path "custom-engine\*" -Destination $enginePath -Recurse -Force

      - name: Patch Flutter
        shell: bash
        run: |
          flutter_root="$(dirname "$(dirname "$(which flutter)")")"
          git -C "$flutter_root" apply "$GITHUB_WORKSPACE/rustdesk/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        shell: bash
        working-directory: rustdesk
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          "$VCPKG_ROOT/vcpkg" install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"

      - name: Build RustDesk
        shell: pwsh
        working-directory: rustdesk
        run: python .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram

      - name: Verify and package runtime
        shell: pwsh
        run: |
          $release = Join-Path $env:GITHUB_WORKSPACE "rustdesk\flutter\build\windows\x64\runner\Release"
          & (Join-Path $release "rustdesk.exe") --version
          Compress-Archive -Path (Join-Path $release "*") -DestinationPath (Join-Path $env:GITHUB_WORKSPACE "rustdesk-runtime.zip") -CompressionLevel Optimal

      - name: Upload runtime
        uses: actions/upload-artifact@v4
        with:
          name: densenremote-rustdesk-1.4.9-windows-x64
          path: rustdesk-runtime.zip
          if-no-files-found: error
          retention-days: 7